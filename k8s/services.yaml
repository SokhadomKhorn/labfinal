# API Gateway Service - the only entry point from outside (Postman)
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Update Service - internal only, the API Gateway calls it at http://update-service:5002
apiVersion: v1
kind: Service
metadata:
  name: update-service
spec:
  type: ClusterIP
  selector:
    app: update
  ports:
    - name: http
      port: 5002
      targetPort: 5002
