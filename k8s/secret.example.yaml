# Example only - do NOT commit your real connection string.
# Easier: create the secret from your .env with
#   kubectl create secret generic mongodb-secret --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
stringData:
  MONGODB_URI: "mongodb+srv://USER:PASSWORD@YOUR_CLUSTER.mongodb.net/?retryWrites=true&w=majority"
